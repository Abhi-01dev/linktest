
server:
  port: ${PORT:8082}

spring:
  application:
    name: linktest-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/linktest}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    # STRICT SAFETY: Never run create, create-drop, or update against Neon production database
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET:linktest_dev_secret_key_needs_to_be_at_least_256_bits_long_for_hmac_sha256}
    expiration-ms: 604800000 # 7 days
  google:
    client-id: ${GOOGLE_CLIENT_ID:310975061442-3j9q7h2jhqc0a4najjp8u3a1s0ftnuqb.apps.googleusercontent.com}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen3:8b}
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173,http://localhost:5174,http://localhost:3000}
  livekit:
    url: ${LIVEKIT_URL:${LIVEKIT_SERVER_URL:wss://linktest-live-lectures-25m7dpyi.livekit.cloud}}
    api-key: ${LIVEKIT_API_KEY:APITmZjrWZKxdgQ}
    api-secret: ${LIVEKIT_API_SECRET:}

livekit:
  url: ${LIVEKIT_URL:${LIVEKIT_SERVER_URL:wss://linktest-live-lectures-25m7dpyi.livekit.cloud}}
  api-key: ${LIVEKIT_API_KEY:APITmZjrWZKxdgQ}
  api-secret: ${LIVEKIT_API_SECRET:}
